name: Test and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov coverage
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
    
    - name: Validate test coverage
      run: |
        python -m coverage report --fail-under=80
    
    - name: Run test validator
      run: |
        python -c "
        from test_validator_agent.agent import test_validator_validate
        import glob
        
        test_files = glob.glob('tests/test_*.py')
        for test_file in test_files:
            result = test_validator_validate(test_file)
            if result['status'] == 'error':
                print(f'Error validating {test_file}: {result.get(\"message\")}')
                exit(1)
            print(f'Validation results for {test_file}:')
            print(f'Test analysis: {result[\"test_analysis\"]}')
            print(f'Suggestions: {result[\"suggestions\"]}')
        " 